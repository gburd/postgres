# Configuration for the threaded ssl regression harness (check-threaded-ssl).
#
# Runs the src/test/ssl TAP suite under the multithreaded carrier so the
# server-side TLS handshake, client-certificate authentication, CRL rejection,
# SCRAM channel binding (tls-server-end-point), and the ssl_sni gate are all
# exercised on the xtc-carrier backend-fiber path -- not just in process mode.
#
# This is the regression coverage that the be_tls_* -> xtc_tls_* TLS-backend
# swap requires before it can land: without it a threaded-mode TLS change has
# no cert-verification / CRL / channel-binding / SNI coverage.  It is wired as
# TEMP_CONFIG (PostgreSQL::Test::Cluster appends it to postgresql.conf), so the
# unmodified ssl TAP tests boot a threaded server.
#
# thread-per-session (pooled_protocol_carriers = 0) is used as the stable
# baseline; io_method = sync keeps the harness deterministic and independent of
# the AIO worker path.  ssl_sni is left at its default (off): the ssl_sni
# no-migrate invariant (be-secure-openssl.c) keeps a server-side-SNI connection
# on the OpenSSL path until libxtc's deferred ClientHello context-swap (#29)
# lands, and 004_sni still exercises the SNI machinery in process mode.
multithreaded = on
pooled_protocol_carriers = 0
io_method = sync
summarize_wal = off
