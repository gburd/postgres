# Configuration for the full threaded regression target with worker paths on.
#
# Keep check-threaded on threaded_smoke.conf as the stable full core baseline.
# This config deliberately admits AIO worker and WAL summarizer startup so the
# branch has a repeatable visibility target for worker-backed threaded runtime
# behavior.
multithreaded = on
pooled_protocol_carriers = 0
io_method = worker
summarize_wal = on
