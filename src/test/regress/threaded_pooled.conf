# Configuration for the pooled-protocol threaded regression target.
#
# This exercises the DEFAULT threaded mode as of Session 3: multithreaded=on
# with the pooled protocol scheduler enabled (client backends multiplex over a
# bounded carrier pool instead of one OS thread per session).  check-threaded /
# check-threaded-workers stay pinned to thread-per-session as the stable
# baselines; this target is the pooled counterpart so the default gets full
# core regression coverage.
#
# A fixed small carrier count keeps runs deterministic and forces genuine
# session-over-carrier multiplexing (sessions far outnumber carriers under the
# parallel schedule).
multithreaded = on
pooled_protocol_carriers = 4
io_method = sync
summarize_wal = off
